<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7"><title>Horario Docente Inteligente</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#000;--mut:#8a8a8e;--sep:rgba(60,60,67,.18);--glass:rgba(249,249,249,.78);--ac:#007aff;--r:20px;--sp:cubic-bezier(.32,.72,0,1)}
body.dark{--bg:#000;--card:#1c1c1e;--ink:#fff;--mut:#98989f;--sep:rgba(84,84,88,.6);--glass:rgba(29,29,31,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;background-size:cover;background-position:center}
#app{height:100%;max-width:760px;margin:auto;position:relative}
#view{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 120px;scroll-behavior:smooth}
.v{animation:in .5s var(--sp)}@keyframes in{from{opacity:0;transform:translateY(18px) scale(.985)}}
h1{font-size:34px;letter-spacing:-.8px;margin:6px 4px 2px}.sub{color:var(--mut);margin:0 4px 16px}
h3{margin:22px 8px 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:.5px solid var(--sep)}.row:last-child{border:0}.row>.g{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}
.tab{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 28px));display:flex;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-radius:30px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:5}
.tab button{flex:1;border:0;background:none;color:var(--mut);font:600 11px inherit;padding:8px 0;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.35s var(--sp)}
.tab button span{font-size:20px;transition:transform .35s var(--sp)}
.tab button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}.tab button.on span{transform:scale(1.18)}
.btn{border:0;background:var(--ac);color:#fff;font:600 16px inherit;padding:12px 18px;border-radius:14px;transition:transform .2s var(--sp)}.btn:active{transform:scale(.95)}
.btn.s{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}.btn.r{background:rgba(255,59,48,.14);color:#ff3b30}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:12px;padding:12px;outline:0}
input:focus,textarea:focus{box-shadow:0 0 0 2px var(--ac)}textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:12px 4px 5px}
.hero{background:linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#af52de));color:#fff;border-radius:28px;padding:20px;display:flex;align-items:center;gap:18px;margin-bottom:12px;box-shadow:0 14px 34px color-mix(in srgb,var(--ac) 40%,transparent)}
.hero b{font-size:26px;letter-spacing:-.5px}.hero .t{opacity:.85;font-size:14px}
.ring{width:96px;height:96px;flex:none;position:relative}.ring svg{transform:rotate(-90deg)}
.ring i{position:absolute;inset:0;display:grid;place-items:center;font:700 19px -apple-system,sans-serif;font-style:normal;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px}.seg button{flex:1;border:0;background:none;color:var(--ink);padding:8px;border-radius:10px;font:600 14px inherit;transition:.3s var(--sp)}.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.wk{display:grid;grid-template-columns:34px repeat(5,1fr);gap:6px}
.wk .h{text-align:center;font-size:12px;font-weight:700;color:var(--mut);padding:4px 0}.wk .h.td{color:var(--ac)}
.wk .t{font-size:11px;color:var(--mut);display:grid;place-items:center;text-align:center;line-height:1.1}
.cl{border:0;border-radius:13px;min-height:54px;font:700 15px inherit;color:#fff;position:relative;transition:transform .25s var(--sp)}.cl:active{transform:scale(.9)}
.cl.e{background:var(--bg);color:var(--mut)}.cl.now{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ac);animation:pl 2s infinite}
@keyframes pl{50%{transform:scale(1.05)}}
.cl .n{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#fff}
.rc{grid-column:1/-1;text-align:center;font-size:12px;color:var(--mut);padding:2px;background:repeating-linear-gradient(90deg,var(--sep) 0 6px,transparent 6px 12px) bottom/100% 1px no-repeat}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:.4s;z-index:9;pointer-events:none}.ov.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:50%;bottom:0;width:min(640px,100%);max-height:88%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,105%);transition:transform .55s var(--sp);z-index:10}
.sh.on{transform:translate(-50%,0)}.sh:before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 12px}
.sh h2{margin:0 0 6px;font-size:22px}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);flex:none;background:none;transition:.3s var(--sp);color:#fff;font-size:15px}.ck.on{background:#34c759;border-color:#34c759;transform:scale(1.1)}
.done{text-decoration:line-through;opacity:.5}
.bar{height:8px;border-radius:5px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:#34c759;transition:width .8s var(--sp)}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-90px);background:var(--glass);backdrop-filter:blur(20px);padding:11px 20px;border-radius:99px;font-weight:600;z-index:20;transition:transform .5s var(--sp);box-shadow:0 6px 24px rgba(0,0,0,.2)}.toast.on{transform:translate(-50%,0)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--sep)}.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.big{font:700 54px -apple-system,sans-serif;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-2px;margin:6px 0}
.q{position:relative}.q input{padding-left:38px}.q:before{content:"🔍";position:absolute;left:12px;top:11px;font-size:15px}
[data-a]{cursor:pointer;user-select:none;-webkit-user-select:none}
button,.cl,.ck,.row[data-a],.card,.sw button{transition:transform .25s var(--sp),background .25s,opacity .25s,box-shadow .25s}
.row[data-a]{margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:12px}
.row[data-a]:active{background:color-mix(in srgb,var(--ac) 14%,transparent);transform:scale(.97)}
button:active,.ck:active,.seg button:active,.tab button:active{transform:scale(.88)}
.sw button:active{transform:scale(.75)}.card:active{transform:scale(.992)}
.toast.on:active{transform:translate(-50%,0) scale(.94)}
input,select,textarea{transition:box-shadow .25s,transform .25s var(--sp)}
input:active,select:active,textarea:active,label:active{transform:scale(.985)}
.pop{animation:pop .5s var(--sp)}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.sh input,.sh select,.sh textarea{background:var(--card)}
.sh{max-height:88dvh}
.dt{display:flex;gap:8px;position:relative}.dt input:first-child{flex:1}
.dt button{border:0;border-radius:12px;background:var(--bg);color:var(--ink);font-size:20px;padding:0 16px}
.sh .dt button{background:var(--card)}
.al{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.tab,.ov,.sh{display:none}#view{overflow:visible;height:auto}body{overflow:visible}}
</style></head><body>
<div id="app"><div id="view"></div></div>

<script>
(function(){"use strict";
var K="hdi.v2",D=["Lunes","Martes","Miércoles","Jueves","Viernes"],N=7,$=function(i){return document.getElementById(i)};

notes:{},pf:"Grupo 1",profiles:{},stu:[],att:{},off:[],lastExp:Date.now(),tasks:[],exams:[],grades:{},

var S=ld(),tab="hoy",q="",pom={m:"foco",left:1500,run:false,t:null,cnt:0},fired={};
function cp(o){return JSON.parse(JSON.stringify(o))}

function today(){var d=new Date().getDay()-1;return d>=0&&d<5?d:-1}

/* ---------- vistas ---------- */
var V={
hoy:function(){var x=cur(),h=new Date().getHours(),g=h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches",nm=S.user?", "+esc(S.user):"";

  o+='<div class="hero"><div class="ring"><svg width="96" height="96"><circle cx="48" cy="48" r="'+r+'" stroke="rgba(255,255,255,.28)" stroke-width="9" fill="none"/><circle cx="48" cy="48" r="'+r+'" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-p)+'" style="transition:stroke-dashoffset 1s"/></svg><i>'+left+'′</i></div><div><div class="t">En clase ahora</div><b>'+esc(S.subj[cd]||cd)+'</b><div class="t">'+fm(x.c.s)+' – '+fm(x.c.e)+' · turno '+(x.c.i+1)+'</div></div></div>'}
 else{o+='<div class="hero"><div><div class="t">'+(x.off?"Día libre":x.d<0?"Fin de semana":"Sin clase ahora")+'</div><b>'+(x.n?"Siguiente: "+esc(S.subj[S.grid[x.d][x.n.i]]||""):(x.off?esc(x.off.t||""):"Disfruta tu tiempo libre"))+'</b>'+(x.n?'<div class="t">Empieza en '+Math.ceil(x.n.s-nowM())+' min ('+fm(x.n.s)+')</div>':"")+'</div></div>'}
 if(x.d>=0){o+='<h3>Línea de tiempo de hoy</h3><div class="card">';slots().forEach(function(s){if(s.r){o+='<div class="row mut"><span style="width:50px">'+fm(s.s)+'</span>☕ Receso</div>';return}var c=S.grid[x.d][s.i];
  o+='<div class="row" data-a="cell" data-d="'+x.d+'" data-t="'+s.i+'" style="opacity:'+(nowM()>s.e?.45:1)+'"><span class="mut" style="width:50px">'+fm(s.s)+'</span><i class="dot" style="background:'+(c?col(c):"var(--sep)")+'"></i><div class="g">'+esc(S.subj[c]||c||"Hora libre")+'</div>'+(S.notes[x.d+"-"+s.i]?"📝":"")+'</div>'});o+='</div>'}
 var pend=S.tasks.filter(function(t){return!t.done}).sort(function(a,b){return(a.due||"9")>(b.due||"9")?1:-1}).slice(0,3);

 var ex=S.exams.filter(function(e){return dleft(e.d)>=0}).sort(function(a,b){return a.d>b.d?1:-1})[0];
 if(ex)o+='<div class="card row" style="border-bottom:0"><div class="g"><b>'+esc(ex.t)+'</b><div class="mut">'+esc(S.subj[ex.s]||"")+'</div></div><b style="font-size:28px;color:var(--ac)">'+dleft(ex.d)+'<small style="font-size:13px"> días</small></b></div>';
 var fr=0;if(x.d>=0)S.grid[x.d].forEach(function(c){if(!c)fr++});if(x.d>=0&&fr)o+='<p class="mut" style="text-align:center">✨ Hoy tienes '+fr+' hora(s) libre(s)</p>';

 var c=cur().c;slots().forEach(function(s){if(s.r){o+='<div class="rc">☕ receso '+fm(s.s)+'</div>';return}o+='<div class="t">'+fm(s.s)+'</div>';for(var i=0;i<5;i++){var cd=S.grid[i][s.i];o+='<button class="cl '+(cd?"":"e")+(c&&c.i==s.i&&i==d?" now":"")+'" data-a="cell" data-d="'+i+'" data-t="'+s.i+'" style="'+(cd?"background:"+col(cd):"")+'">'+(esc(cd)||"+")+(S.notes[i+"-"+s.i]?'<b class="n"></b>':"")+'</button>'}});
 o+='</div></div><h3>Leyenda</h3><div class="card">'+Object.keys(hrs()).map(function(k){return'<div class="row"><i class="dot" style="background:'+col(k)+'"></i><div class="g">'+esc(S.subj[k]||k)+'</div><span class="mut">'+hrs()[k]+' h</span></div>'}).join("")+'</div>';

 o+='<div class="card">'+ks.map(function(k){var g=S.grades[k]||[],w=0,a=0;g.forEach(function(x){w+=+x.w;a+=x.n*x.w});var pr=w?(a/w).toFixed(1):"–";return'<div class="row" data-a="grd" data-k="'+esc(k)+'"><i class="dot" style="background:'+col(k)+'"></i><div class="g">'+esc(S.subj[k])+'<div class="mut">'+g.length+' evaluaciones</div></div><b style="font-size:20px;color:'+(pr!="–"&&pr<60?"#ff3b30":"#34c759")+'">'+pr+'</b></div>'}).join("")+'</div>';
 var all=[];ks.forEach(function(k){var g=S.grades[k]||[],w=0,a=0;g.forEach(function(x){w+=+x.w;a+=x.n*x.w});if(w)all.push(a/w)});
 if(all.length)o+='<div class="card row" style="border:0"><div class="g"><b>Promedio general</b></div><b style="font-size:28px;color:var(--ac)">'+(all.reduce(function(a,b){return a+b})/all.length).toFixed(1)+'</b></div>';
 o+='<h3>Asistencia</h3><div class="card"><div class="row" data-a="att"><div class="g">Pasar lista de hoy<div class="mut">'+S.stu.length+' alumnos en '+esc(S.pf)+'</div></div>✓</div></div><h3>Carga semanal por asignatura</h3><div class="card">'+Object.keys(H).map(function(k){return'<div style="margin:6px 0"><div style="display:flex;justify-content:space-between"><span>'+esc(S.subj[k]||k)+'</span><span class="mut">'+H[k]+' h</span></div><div class="bar"><i style="width:'+H[k]/mx*100+'%;background:'+col(k)+'"></i></div></div>'}).join("")+'</div>';
 return o},
